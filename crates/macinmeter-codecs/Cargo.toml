[package]
name = "macinmeter-codecs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Content probing and the strict PCM source contract behind MacinMeter's stable decode routes."
keywords = ["audio", "wav", "flac", "aiff", "alac"]
categories = ["multimedia::audio", "multimedia::encoding"]

[features]
# Hidden dev-only seam for local fuzz runners; never enabled by the product.
malformed-dev = []
# Hidden source-owned timing seam for local ADR-0014 attribution. It is absent
# from ordinary product builds and does not select a production execution mode.
performance-probes = []

[dependencies]
macinmeter-domain = { path = "../macinmeter-domain", version = "0.3.0" }
symphonia.workspace = true

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
