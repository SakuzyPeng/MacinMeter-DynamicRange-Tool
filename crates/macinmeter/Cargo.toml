[package]
name = "macinmeter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Enable the non-default ADR-0014 measurement seams: codec attribution and the
# decode-analysis overlap candidate. Ordinary library, CLI and GUI builds never
# enable either one.
performance-probes = ["macinmeter-codecs/performance-probes"]

[dependencies]
macinmeter-analysis = { path = "../macinmeter-analysis" }
macinmeter-codecs = { path = "../macinmeter-codecs" }
macinmeter-domain = { path = "../macinmeter-domain" }
serde.workspace = true
walkdir.workspace = true

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
