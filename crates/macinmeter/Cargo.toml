[package]
name = "macinmeter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline audio dynamic-range (DR) analysis: the public file, batch and discovery facade."
keywords = ["audio", "dynamic-range", "dr", "loudness", "analysis"]
categories = ["multimedia::audio", "command-line-utilities"]

[features]
# Enable the non-default ADR-0014 measurement seams: codec attribution and the
# decode-analysis overlap candidate. Ordinary library, CLI and GUI builds never
# enable either one.
performance-probes = ["macinmeter-codecs/performance-probes"]

[dependencies]
macinmeter-analysis = { path = "../macinmeter-analysis", version = "0.3.1" }
macinmeter-codecs = { path = "../macinmeter-codecs", version = "0.3.1" }
macinmeter-domain = { path = "../macinmeter-domain", version = "0.3.1" }
serde.workspace = true
walkdir.workspace = true

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
