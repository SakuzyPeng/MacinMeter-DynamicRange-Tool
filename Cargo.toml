[package]
name = "macinmeter-dr-tool"
version = "0.1.3"
edition = "2024"
authors = ["MacinMeter Team"]
description = "High-precision audio dynamic range analyzer / 高精度音频动态范围分析工具"

[[bin]]
name = "MacinMeter-DynamicRange-Tool-foo_dr"
path = "src/main.rs"

[[bin]]
name = "dr-bench"
path = "src/bin/dr-bench.rs"

[dependencies]
# 音频文件解码
hound = "3.5"
#  优化：启用所有必要的编解码器，支持多格式兼容
symphonia = { version = "0.5", features = [
    "flac",      # FLAC支持（音质测试常用）
    "mp3",       # MP3支持（通用格式）
    "mp1",       # MP1支持（MPEG Audio Layer I）
    "aac",       # AAC支持
    "vorbis",    # OGG Vorbis支持
    "wav",       # WAV支持（基础格式）
    "aiff",      # AIFF支持（关键修复）
    "alac",      # Apple Lossless编解码器
    "isomp4",    # MP4/M4A容器格式支持（关键修复）
    "mkv",       # MKV/WebM容器格式支持
    "pcm",       # 通用PCM支持（AU, CAF等）
] }

# 工具库
walkdir = "2.5"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 性能优化（可选）
rayon = "1.10"
crossbeam-channel = "0.5"  # 高性能MPMC通道，替代std::sync::mpsc
thread-priority = "1.2"  # 线程优先级控制，Intel混合架构P-core优先
unicode-width = "0.1"
comfy-table = "7"  # 表格格式化

# 时间处理 - 恢复chrono（虽然增加35KiB，但保证时间准确性）
chrono = { version = "0.4", features = ["serde"] }

# 系统信息监控 - 用于 dr-bench 性能基准工具
sysinfo = "0.30"

# 全局静态变量支持 - 未使用，已移除（节省~5KiB）
# lazy_static = "1.4"

# Opus音频支持
songbird = { version = "0.5", default-features = false, features = [
    "driver",
    "rustls",
    "tungstenite",
] }
symphonia-core = "0.5.4"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread"] }

# 可选CPU火焰图分析（仅在设置环境变量 DR_FLAME=1 时启用，默认无开销）
pprof = { version = "0.14", features = ["flamegraph"], optional = true }

# 安全漏洞修复：强制更新间接依赖的最低版本
# RUSTSEC-2026-0007: bytes整数溢出漏洞修复
bytes = "1.11.1"
# RUSTSEC-2026-0009: time拒绝服务漏洞修复
time = "0.3.47"

[features]
default = []
# 启用后将链接 pprof 依赖，但仍需通过环境变量 DR_FLAME=1 才会实际记录
flame-prof = ["pprof"]
# 启用SIMD性能测试（包含大数据集，可能导致CI链接器崩溃，默认禁用）
simd-perf-tests = []

[dev-dependencies]
fs2 = "0.4"

# 安全警告说明：
# songbird的Discord依赖存在已知安全问题，但不影响我们的使用场景：
# - ring/rustls: TLS问题，我们无网络通信
# - tungstenite: WebSocket攻击，我们只处理本地文件
# - tracing-subscriber: 日志污染，我们无敏感日志
# - derivative: 编译时工具，运行时无影响
# 风险评估：本地文件解码场景下，这些问题的攻击面为零

[profile.release]
opt-level = 3          #  性能优化（针对处理/解码路径更合适）
lto = "fat"            # 更激进的链接时优化
codegen-units = 1      # 单个代码生成单元（更好的优化）
panic = "abort"        # panic时直接abort（减少代码体积）
strip = true           # 移除调试符号和其他元数据
overflow-checks = false # 禁用整数溢出检查（release模式下通常安全）

# 专用 Profiling 配置：用于生成带符号的火焰图（不影响正式 release）
[profile.profiling]
inherits = "release"
opt-level = 3
lto = false            # 关闭 LTO，避免函数被过度内联/合并导致符号丢失
debug = 1              # 生成最小调试信息，足够符号解析
strip = false          # 不剥离符号，保证 flamegraph 具备函数名
codegen-units = 1
panic = "abort"
overflow-checks = false
