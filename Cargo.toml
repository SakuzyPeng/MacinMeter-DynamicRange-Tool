[workspace]
members = [
    "crates/macinmeter-domain",
    "crates/macinmeter-analysis",
    "crates/macinmeter-codecs",
    "crates/macinmeter",
    "apps/macinmeter-cli",
    "tauri-app/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
authors = ["MacinMeter Team"]
license = "MIT"
repository = "https://github.com/SakuzyPeng/MacinMeter-DynamicRange-Tool"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = [
    "aiff",
    "alac",
    "flac",
    "isomp4",
    "pcm",
    "wav",
] }
tauri = { version = "2", default-features = false, features = ["image-png", "wry"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tempfile = "3"
thiserror = "2"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
overflow-checks = true
