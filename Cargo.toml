[workspace]
members = [
    "crates/macinmeter-domain",
    "crates/macinmeter-analysis",
    "crates/macinmeter-codecs",
    "crates/macinmeter",
    "apps/macinmeter-cli",
    "tauri-app/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["MacinMeter Team"]
license = "MIT"
repository = "https://github.com/SakuzyPeng/MacinMeter-DynamicRange-Tool"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.5", default-features = false, features = [
    "aiff",
    "flac",
    "pcm",
    "wav",
] }
thiserror = "2"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
overflow-checks = true
