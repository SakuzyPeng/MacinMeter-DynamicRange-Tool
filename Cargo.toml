[workspace]
members = [
    "crates/macinmeter-domain",
    "crates/macinmeter-analysis",
    "crates/macinmeter-codecs",
    "crates/macinmeter",
    "apps/macinmeter-cli",
    "apps/macinmeter-desktop",
    "tauri-app/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.98"
authors = ["MacinMeter Team"]
license = "MIT"
repository = "https://github.com/SakuzyPeng/MacinMeter-DynamicRange-Tool"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
ctrlc = "3"
# The desktop GUI shares the player's egui stack and pins the same versions.
eframe = { version = "=0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "persistence",
    "wayland",
    "wgpu",
    "x11",
] }
# Image export rasterises the GUI's own SVG with the embedded UI fonts only:
# no system fonts, so a PNG does not depend on what the host has installed.
resvg = { version = "0.50", default-features = false, features = ["text"] }
# Unlike the player, no `common-controls-v6`: that feature imports
# TaskDialogIndirect, which only Common Controls v6 exports, so a binary
# without the player's embedded comctl v6 manifest would fail to start on
# Windows. The MessageBoxW path covers the OK/Cancel confirmation used here.
rfd = { version = "=0.17.2", default-features = false, features = [
    "wayland",
    "xdg-portal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Glyph advances of the embedded UI font, for laying out exported images. The
# version resvg already resolves, so the graph gains no new copy.
skrifa = "0.49"
symphonia = { version = "0.5.5", default-features = false, features = [
    "aiff",
    "alac",
    "flac",
    "isomp4",
    "pcm",
    "wav",
] }
tauri = { version = "2", default-features = false, features = ["image-png", "wry"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tempfile = "3"
thiserror = "2"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
overflow-checks = true
