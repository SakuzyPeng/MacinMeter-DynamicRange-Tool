name: Workspace validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: workspace-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: Linux repository, Rust, CLI, and GUI
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install Linux workspace dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Check repository identity
        run: python3 scripts/check-repository-contract.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run standard workspace tests
        run: cargo test --locked --workspace --all-targets

      - name: Run reference-tool tests
        run: python3 -m unittest discover -s reference/tools/tests -p 'test_*.py'

      - name: Run repository-tool tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Build release CLI
        if: github.event_name == 'workflow_dispatch'
        run: cargo build --locked --release -p macinmeter-cli

      - name: Install GUI dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Build GUI frontend
        working-directory: tauri-app
        run: npm run build

  windows:
    name: Windows Rust, CLI, and Tauri
    runs-on: windows-2025
    timeout-minutes: 75

    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          toolchain: 1.88.0
          components: clippy

      - name: Check repository identity
        run: python scripts/check-repository-contract.py

      - name: Run Windows Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run Windows workspace tests
        run: cargo test --locked --workspace --all-targets

      - name: Build Windows release CLI
        if: github.event_name != 'pull_request'
        run: cargo build --locked --release -p macinmeter-cli

      - name: Smoke-test Windows release CLI
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $version = & .\target\release\mdrmeter.exe --version
          if ($LASTEXITCODE -ne 0 -or -not $version.StartsWith("mdrmeter ")) {
            throw "release CLI version smoke test failed"
          }

          $document = & .\target\release\mdrmeter.exe analyze `
            .\tests\fixtures\native-pcm-v1\wav-pcm-s16-stereo.wav `
            --format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $document.schemaVersion -ne 4 `
              -or $document.kind -ne "analysis") {
            throw "release CLI analysis smoke test failed"
          }

      # The Windows GUI is built so it can be exercised, not distributed.
      # ADR-0011 keeps the release scope on unsigned Apple Silicon macOS, and
      # nothing below produces a release candidate or claims one.
      - name: Install Node.js for the Windows GUI test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install GUI dependencies
        if: github.event_name == 'workflow_dispatch'
        working-directory: tauri-app
        run: npm ci

      - name: Build the Windows GUI test bundle
        if: github.event_name == 'workflow_dispatch'
        working-directory: tauri-app
        # The committed bundle targets are the macOS release ones. Naming the
        # Windows bundle here keeps that configuration the single source of the
        # release contract instead of widening it for a test build.
        run: npm run tauri -- build --bundles nsis

      - name: Verify the Windows GUI test bundle
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $exe = Get-Item .\target\release\macinmeter-gui.exe
          $installer = Get-ChildItem .\target\release\bundle\nsis\*-setup.exe
          if ($installer.Count -ne 1) {
            throw "expected exactly one NSIS installer, found $($installer.Count)"
          }
          if ($exe.Length -le 0 -or $installer[0].Length -le 0) {
            throw "the Windows GUI build produced an empty artifact"
          }
          $version = (Get-Item .\target\release\mdrmeter.exe).VersionInfo
          Write-Host "gui exe:       $($exe.FullName) ($($exe.Length) bytes)"
          Write-Host "nsis installer: $($installer[0].Name) ($($installer[0].Length) bytes)"
          # Byte identity for whatever is handed to a tester, so a reported
          # problem can be tied to an exact artifact.
          Get-FileHash $exe.FullName, $installer[0].FullName -Algorithm SHA256 |
            ForEach-Object { Write-Host "$($_.Hash)  $($_.Path)" }

      - name: Retain the Windows CLI and GUI test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Named a test build, not a candidate: it is unsigned, outside the
          # ADR-0011 release scope, and must not be mistaken for a release asset.
          name: macinmeter-windows-test-build-${{ github.sha }}
          path: |
            target/release/mdrmeter.exe
            target/release/macinmeter-gui.exe
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos:
    name: macOS arm64 Rust, CLI, Tauri, and GUI staging
    runs-on: macos-26
    timeout-minutes: 60

    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          toolchain: 1.88.0
          components: clippy

      - name: Check repository identity
        run: python3 scripts/check-repository-contract.py

      - name: Run macOS Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run macOS workspace tests
        run: cargo test --locked --workspace --all-targets

      - name: Install Node.js for GUI staging
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install GUI dependencies
        if: github.event_name != 'pull_request'
        working-directory: tauri-app
        run: npm ci

      - name: Stage and verify macOS arm64 CLI and GUI
        if: github.event_name == 'push'
        run: python3 scripts/stage-release.py stage --include-gui

      - name: Require main for the unsigned release candidate
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Prepare unsigned Apple Silicon release candidate
        if: github.event_name == 'workflow_dispatch'
        run: >-
          python3 scripts/stage-release.py stage --include-gui
          --unsigned-macos-arm64-candidate

      - name: Retain unsigned Apple Silicon release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macinmeter-unsigned-macos-arm64-${{ github.sha }}
          path: target/release-candidates/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
