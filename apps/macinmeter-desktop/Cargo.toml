[package]
name = "macinmeter-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MacinMeter Dynamic Range desktop GUI on egui (prototype beside the Tauri GUI)"
# An application shell, not a library: it embeds a UI font and window glue.
publish = false

[[bin]]
name = "macinmeter-desktop"
path = "src/main.rs"

[build-dependencies]
sha2.workspace = true

[dependencies]
eframe.workspace = true
macinmeter = { path = "../../crates/macinmeter", version = "0.3.1" }
