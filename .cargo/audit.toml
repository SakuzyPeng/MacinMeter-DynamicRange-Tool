[advisories]
ignore = [
    # `quick-xml` is only linked by the opt-in `flame-prof` developer feature
    # through pprof/inferno. The application does not parse user-provided XML.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # These versions are locked by Songbird's optional Serenity integration.
    # This project disables Songbird default features and enables only
    # `driver`, `rustls`, and `tungstenite`; the affected Serenity branch is
    # absent from the all-features/all-targets dependency tree.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]
