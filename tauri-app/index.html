<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MacinMeter foo_dr_meter 1.0.8 Candidate V1 offline dynamic-range analyzer"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>MacinMeter 0.2</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">MACINMETER · M0</p>
          <h1>动态范围分析</h1>
          <p class="subtitle">Offline dynamic-range analysis</p>
        </div>
        <div class="status-chip">
          <span class="status-dot"></span>
          foo_dr_meter 1.0.8 Candidate V1 · Unverified
        </div>
      </header>

      <section class="notice">
        当前算法是针对 foo_dr_meter 1.0.8 的 Candidate V1，仍为 Unverified。结果用于工程验证，不代表已经参考兼容。
      </section>

      <section class="card controls">
        <div class="section-heading">
          <div>
            <p class="section-kicker">01 · INPUT</p>
            <h2>选择输入</h2>
          </div>
          <span id="version-label" class="muted">v0.2.0</span>
        </div>

        <div class="button-row">
          <button id="choose-files" type="button">选择文件</button>
          <button id="choose-folder" type="button" class="secondary">选择目录</button>
          <button id="clear-inputs" type="button" class="quiet">清空</button>
        </div>

        <div id="selection" class="selection empty">尚未选择输入</div>

        <label class="check-row">
          <input id="recursive" type="checkbox" />
          <span>递归扫描子目录</span>
        </label>

        <div class="action-row">
          <button id="analyze" type="button" class="primary" disabled>开始分析</button>
          <button id="cancel" type="button" class="danger" disabled>取消当前任务</button>
        </div>
      </section>

      <section class="card">
        <div class="section-heading">
          <div>
            <p class="section-kicker">02 · RESULT</p>
            <h2>分析结果</h2>
          </div>
          <button id="copy-json" type="button" class="quiet" disabled>复制 JSON</button>
        </div>
        <div id="run-status" class="run-status">等待任务</div>
        <div id="results" class="results"></div>
        <details id="raw-panel" class="raw-panel" hidden>
          <summary>结构化结果</summary>
          <pre id="raw-json"></pre>
        </details>
      </section>
    </main>
  </body>
</html>
