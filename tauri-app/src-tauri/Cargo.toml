[package]
name = "macinmeter-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MacinMeter Dynamic Range GUI"

[lib]
# Distinct from the binary target so Windows does not collide their debug
# symbols: both would otherwise emit `macinmeter_gui.pdb` into one directory,
# which Cargo reports on every Windows build.
name = "macinmeter_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
macinmeter = { path = "../../crates/macinmeter" }
serde.workspace = true
tauri.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-fs.workspace = true
